<!doctype html>
<html lang="ur-Latn">
<head>
  
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>GoodWe Pakistan — Aap ki raaye</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23ffffff'/><text x='16' y='23' font-family='Arial' font-weight='700' font-size='20' fill='%23E2231A' text-anchor='middle'>W</text></svg>">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0A0A0A; color: #F2F2F2;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  .msg { display: none; position: fixed; inset: 0; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; }
  .mark { width: 44px; height: 44px; border-radius: 10px; background: #fff; color: #E2231A; display: grid; place-items: center;
    font-weight: 700; font-size: 22px; margin-bottom: 16px; }
  .msg h1 { font-size: 20px; margin: 0 0 8px; }
  .msg p { font-size: 15px; color: #A3A3A3; margin: 0 0 20px; max-width: 360px; line-height: 1.5; }
  .msg a { display: inline-block; background: #E2231A; color: #fff; text-decoration: none; font-weight: 600;
    font-size: 15px; padding: 12px 26px; border-radius: 10px; }
</style>
</head>
<body>

<iframe id="form" title="GoodWe Pakistan feedback form" hidden></iframe>

<!-- Opened without a feedback link -->
<div class="msg" id="no-link">
  <div class="mark" aria-hidden="true">W</div>
  <h1>GoodWe Pakistan Aftersales</h1>
  <p>Raaye dene ke liye WhatsApp par bheja gaya link kholein.<br>Please open the feedback link sent to you on WhatsApp.</p>
</div>

<!-- Form couldn't load inside this page -->
<div class="msg" id="fallback">
  <div class="mark" aria-hidden="true">W</div>
  <h1>Aap ki raaye</h1>
  <p>Form yahan load nahi ho saka. Neeche button dabayein.</p>
  <a id="fallback-link" target="_top">Form kholein</a>
</div>

<script>
  // Same Apps Script web app as the portal. Only ?fb=… links are passed through,
  // so this address never shows the staff login.
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwsvxchB4M19LV2z5MCgHMH8byK8KcebPxinhSR0VgtZjM3njYbsTE03zAhAuiD7-8e/exec';

  var token = new URLSearchParams(location.search).get('fb') || '';
  if (!/^[a-f0-9]{16}$/.test(token)) {
    document.getElementById('no-link').style.display = 'flex';
  } else {
    var url = APP_URL + '?fb=' + token;
    var frame = document.getElementById('form');
    document.getElementById('fallback-link').href = url;
    frame.hidden = false;
    frame.src = url;
    var loaded = false;
    frame.addEventListener('load', function () { loaded = true; });
    setTimeout(function () {
      if (!loaded) { frame.hidden = true; document.getElementById('fallback').style.display = 'flex'; }
    }, 10000);
  }
</script>
</body>
</html>
